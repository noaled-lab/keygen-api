services:
  keygen-setup:
    profiles: [ "setup" ]
    image: keygen/api:latest
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@keygen-postgres:5432/${POSTGRES_DB}"
      DISABLE_DATABASE_ENVIRONMENT_CHECK: 1
    env_file:
      - .env
    command: >
      sh -c "
        until pg_isready -h keygen-postgres -U ${POSTGRES_USER}; do
          echo 'Waiting for PostgreSQL...'
          sleep 1
        done
        bundle exec rails keygen:setup
      "
    depends_on: [ keygen-postgres ]
    tty: true
    stdin_open: true

  keygen-console:
    profiles: [ "console" ]
    image: keygen/api:latest
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@keygen-postgres:5432/${POSTGRES_DB}"
    env_file:
      - .env
    command: bundle exec rails console
    depends_on: [ keygen-postgres ]
    tty: true
    stdin_open: true

  keygen-migrate:
    profiles: [ "migrate" ]
    image: keygen/api:latest
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@keygen-postgres:5432/${POSTGRES_DB}"
    env_file:
      - .env
    command: bundle exec rails db:migrate
    depends_on: [ keygen-postgres ]

  # 공식 postgres:17.5 + WAL-G 실행 파일. WAL을 S3(RustFS)에 올린다. 설정은 .env.backup (README "DB 백업").
  keygen-postgres:
    image: keygen-postgres:17.5-walg3.0.9
    build:
      dockerfile_inline: |
        FROM postgres:17.5
        ARG TARGETARCH
        RUN set -eux; \
            apt-get update; apt-get install -y --no-install-recommends ca-certificates curl; rm -rf /var/lib/apt/lists/*; \
            case "$$TARGETARCH" in \
              amd64) f=wal-g-pg-22.04-amd64;   sha=d6795c663894d836ba20840bffe8970aed81bbe25d3151bd4951f6f9c362def9 ;; \
              arm64) f=wal-g-pg-22.04-aarch64; sha=072eb4a4a119f817e1fa888c64a776b01e3453b2e0d967a67d149adb18fde652 ;; \
            esac; \
            curl -fsSL -o /usr/local/bin/wal-g "https://github.com/wal-g/wal-g/releases/download/v3.0.9/$$f"; \
            echo "$$sha  /usr/local/bin/wal-g" | sha256sum -c -; \
            chmod 755 /usr/local/bin/wal-g
    restart: unless-stopped
    env_file:
      - .env.backup
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 바뀐 게 있으면 늦어도 5분(archive_timeout) 안에 WAL을 올린다.
    command: [ "postgres", "-c", "archive_mode=on", "-c", "archive_timeout=300", "-c", "archive_command=wal-g wal-push %p" ]
    volumes:
      - postgres:/var/lib/postgresql/data

  # 매일 BACKUP_TIME에 백업 (BACKUP_FULL_WEEKDAY는 전체, 나머지는 증분) → 오래된 백업 정리 → 웹훅 알림.
  # 백업이 하나도 없으면 시작하자마자 전체 백업을 한다. 데이터 폴더는 읽기 전용으로만 본다.
  keygen-backup:
    image: keygen-postgres:17.5-walg3.0.9
    pull_policy: never   # keygen-postgres가 빌드한 이미지를 같이 쓴다 (레지스트리에 없음)
    restart: unless-stopped
    user: postgres
    env_file:
      - .env.backup
    environment:
      PGHOST: keygen-postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data:ro
    depends_on: [ keygen-postgres ]
    entrypoint: [ "bash", "-c" ]
    command:
      - |
        notify() {
          [ -n "$${BACKUP_WEBHOOK_URL:-}" ] || return 0
          curl -fsS -m 15 -H 'Content-Type: application/json' -d "{\"text\": \"$$1\"}" "$$BACKUP_WEBHOOK_URL" >/dev/null || echo "알림 전송 실패"
        }
        backup() {
          echo "$$(date '+%F %T') $$1 백업 시작"
          if wal-g backup-push "$$PGDATA" $$2 && wal-g delete retain FULL "$${BACKUP_RETAIN_FULL:-4}" --confirm; then
            echo "$$(date '+%F %T') $$1 백업 성공"; notify "✅ Keygen DB $$1 백업 성공"
          else
            echo "$$(date '+%F %T') $$1 백업 실패"; notify "❌ Keygen DB $$1 백업 실패 (docker compose logs keygen-backup)"
          fi
        }
        until pg_isready -q; do sleep 2; done
        wal-g backup-list 2>/dev/null | grep -q '^base_' || backup 전체 --full
        while true; do
          at="$${BACKUP_TIME:-03:00}"
          next=$$(date -d "today $$at" +%s)
          [ "$$next" -gt "$$(date +%s)" ] || next=$$(date -d "tomorrow $$at" +%s)
          echo "다음 백업: $$(date -d "@$$next" '+%F %T')"
          sleep $$(( next - $$(date +%s) ))
          if [ "$$(date +%u)" = "$${BACKUP_FULL_WEEKDAY:-7}" ]; then backup 전체 --full; else backup 증분; fi
        done

  keygen-redis:
    image: redis
    restart: unless-stopped
    volumes:
      - redis:/data

  keygen-api:
    image: keygen/api:latest
    restart: unless-stopped
    networks:
      - default
      - app
    command: "web"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@keygen-postgres:5432/${POSTGRES_DB}"
    volumes:
      - keygen:/etc/keygen
    depends_on:
      - keygen-postgres
      - keygen-redis

  keygen-worker:
    image: keygen/api:latest
    restart: unless-stopped
    command: "worker"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@keygen-postgres:5432/${POSTGRES_DB}"
    volumes:
      - keygen:/etc/keygen
    depends_on:
      - keygen-postgres
      - keygen-redis

  keygen-portal:
    image: ghcr.io/noaled-lab/keygen-portal:latest
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    external: true

volumes:
  keygen:
  postgres:
  redis:
