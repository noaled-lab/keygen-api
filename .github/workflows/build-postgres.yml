name: Build Postgres (WAL-G) image

# backup/postgres를 바꾸면 ghcr.io/noaled-lab/keygen-postgres:<태그>를 빌드해 올린다.
# 태그는 compose(docker-compose.noaled.yaml)에 고정된 값과 같아야 한다. Postgres · WAL-G 버전을 바꾸면 태그도 바꾼다.
on:
  push:
    branches: [ master ]
    paths:
      - backup/postgres/**
      - .github/workflows/build-postgres.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/noaled-lab/keygen-postgres
  TAG: 17.5-walg3.0.9

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backup/postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ env.TAG }}-${{ github.sha }}
