name: Deploy with Docker Compose

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /home/${{ secrets.REMOTE_USER }}/keygen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose file to remote server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          source: docker-compose.noaled.yaml
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy on remote server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          DOT_ENV: ${{ secrets.DOT_ENV }}
          DOT_ENV_BACKUP: ${{ secrets.DOT_ENV_BACKUP }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          envs: DEPLOY_DIR,DOT_ENV,DOT_ENV_BACKUP,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "$DEPLOY_DIR"
            (umask 077 && printf '%s' "$DOT_ENV" | base64 -d > .env)
            # DB 백업 설정 (README "DB 백업"). 없으면 WAL을 올릴 수 없으므로 배포를 멈춘다.
            if [ -z "$DOT_ENV_BACKUP" ]; then
              echo "DOT_ENV_BACKUP 시크릿이 없습니다 (backup.env.example 참고)" >&2
              exit 1
            fi
            (umask 077 && printf '%s' "$DOT_ENV_BACKUP" | base64 -d > .env.backup)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # keygen-postgres 이미지(postgres + WAL-G)는 compose 안의 Dockerfile로 서버에서 빌드한다.
            docker compose -f docker-compose.noaled.yaml pull --ignore-buildable
            docker compose -f docker-compose.noaled.yaml build
            docker compose -f docker-compose.noaled.yaml run --rm keygen-migrate
            docker compose -f docker-compose.noaled.yaml up -d --remove-orphans
            docker image prune -f
